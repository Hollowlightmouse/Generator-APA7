name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: generate-apa-document
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Run the test suite
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s scripts/tests -t scripts/tests

      - name: Preflight (check)
        shell: bash
        continue-on-error: true
        run: python scripts/apa7.py check

      - name: Dry-run the installer
        shell: bash
        continue-on-error: true
        run: python scripts/apa7.py install --dry-run
